    - orgId: 1
      name: Errors if occurring over longer periods that might require repair
      folder: Critical
      interval: 5m
      rules:
        - uid: rdma-device-status
          title: RDMA Device Status
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: Prometheus
              model:
                editorMode: code
                expr: rdma_device_status == 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{hostname}}'
                maxDataPoints: 43200
                range: false
                refId: A
          dashboardUid: ""
          panelId: 0
          noDataState: NoData
          execErrState: OK
          for: 5m
          annotations:
            summary: RDMA device status check has failed. The RDMA device status value is 0, indicating a potential issue with the RDMA hardware on {{hostname}}. Immediate investigation is required, and a node reboot may be necessary if the issue persists.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
        - uid: rdma-link-flap
          title: RDMA Link Flapping
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: Prometheus
              model:
                editorMode: code
                expr: rdma_link_noflap == 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{hostname}}'
                maxDataPoints: 43200
                range: false
                refId: A
          dashboardUid: ""
          panelId: 0
          noDataState: NoData
          execErrState: OK
          for: 5m
          annotations:
            summary: RDMA link status check has failed. The RDMA link no flap value is 0, indicating potential instability in the RDMA link on {{hostname}}. Immediate investigation is required.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
        - uid: rttcc-status
