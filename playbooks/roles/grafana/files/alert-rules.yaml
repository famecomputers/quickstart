              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: Prometheus
              model:
                editorMode: code
                expr: rttcc_status == 1
                instant: true
                intervalMs: 1000
                legendFormat: '{{hostname}}'
                maxDataPoints: 43200
                range: false
                refId: A
          dashboardUid: ""
          panelId: 0
          noDataState: NoData
          execErrState: OK
          for: 5m
          annotations:
            summary: RTTCC status check has failed. RTTCC should always be disabled, indicating potential issues with congestion control on {{hostname}}. Immediate investigation is required.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
