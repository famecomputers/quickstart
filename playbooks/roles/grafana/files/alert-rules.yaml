apiVersion: 1
groups:
    - orgId: 1
      name: Errors requiring reboot and may be repair
      folder: Critical
      interval: 5m
      rules:
        - uid: ubkpkofyievt
          title: XID Error Check
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bdys1o842usxsc
              model:
                datasource:
                    type: prometheus
                    uid: bdys1o842usxsc
                editorMode: code
                expr: xid_error_check==0
                instant: true
                intervalMs: 1000
                legendFormat: '{{hostname}}'
                maxDataPoints: 43200
                range: false
                refId: A
          dashboardUid: ""
          panelId: 0
          noDataState: NoData
          execErrState: OK
          for: 5m
          annotations:
            summary: XID error check has failed. The XID error check value is 0, indicating a potential issue with the system’s transaction or GPU hardware error on {{hostname}}. Immediate investigation is required.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
        - uid: j9izqq8ayfyy
          title: GPU ECC Error Check
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bdys1o842usxsc
              model:
                datasource:
                    type: prometheus
                    uid: bdys1o842usxsc
                editorMode: code
                expr: gpu_ecc_error_check == 0
                instant: true
                intervalMs: 1000
                legendFormat: '{{hostname}}'
                maxDataPoints: 43200
                range: false
                refId: A
          dashboardUid: ""
          panelId: 0
          noDataState: NoData
          execErrState: OK
          for: 5m
          annotations:
            summary: GPU ECC error check has failed. The ECC error check value is 0, indicating a potential memory issue with the GPU on {{hostname}}. Immediate investigation is required, and a node reboot may be necessary if the issue persists.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
        - uid: z8q9r1gkfdhj
          title: GPU Row Remap Error Check
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
