          for: 5m
          annotations:
            summary: RDMA link status check has failed. The RDMA link no flap value is 0, indicating potential instability in the RDMA link on {{hostname}}. Immediate investigation is required.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: "ons-webhook"        
        - uid: k5q2t3rjmfhh
          title: RTTCC Status Alert
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bdys1o842usxsc
              model:
                datasource:
                    type: prometheus
                    uid: bdys1o842usxsc
                editorMode: code
                expr: rttcc_status == 1
                instant: true
                intervalMs: 1000
                legendFormat: '{{hostname}}'
                maxDataPoints: 43200
                range: false
