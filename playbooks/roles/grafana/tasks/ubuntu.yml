---
- name: Add Grafana GPG key
  become: true
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present
    keyring: /etc/apt/trusted.gpg.d/grafana-archive-keyring.gpg

- name: Add Grafana repository
  become: true
  apt_repository:
    repo: 'deb https://packages.grafana.com/oss/deb stable main'
    state: present
    filename: 'grafana'

- name: Update apt cache
  become: true
  apt:
    update_cache: yes

- name: Install Grafana package
  become: true
  apt:
    name: grafana
    state: present

- name: Install Python dependencies
  pip:
    name:
      - Flask
      - oci
  become: yes

- name: Copy webhook script to server
  become: true
  copy:
    src: files/ons_webhook.py
    dest: /opt/ons_webhook.py
    mode: '0755'

- name: Render systemd service for webhook
  become: true
  template:
    src: ons-webhook.service.j2
    dest: /etc/systemd/system/ons-webhook.service
    force: yes
    backup: yes
    owner: prometheus
    group: prometheus
    mode: '0755'

- name: Reload systemd daemon
  become: true
  command: systemctl daemon-reload

- name: Start and enable webhook service
  become: true
  service:
    name: ons-webhook
    state: started
    enabled: true

- name: Start and enable Grafana service
  become: true
  service:
    name: grafana-server
    state: restarted
    enabled: yes

- name: Ensure Grafana key directory exists
  file:
    path: "/etc/opt/oci-hpc/passwords/grafana"
    state: directory
  delegate_to: localhost

- name: Check Grafana API key list
  uri:
    url: "{{ grafana_api_url }}/api/auth/keys"
    method: GET
    user: "{{ grafana_security.admin_user }}"
    password: "{{ grafana_security.admin_password }}"
    force_basic_auth: true
    return_content: true
  no_log: false
  register: result
  until: result is not failed
  retries: 5
  delay: 5

- name: Create Prometheus datasource in Grafana
  grafana_datasource:
    name: "Prometheus"
    grafana_url: "{{ grafana_api_url }}"
    grafana_user: "{{ grafana_security.admin_user }}"
    grafana_password: "{{ grafana_security.admin_password }}"
    ds_type: "prometheus"
    ds_url: "http://localhost:9090"
  ignore_errors: yes
