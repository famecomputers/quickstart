---
- name: add grafana repository
  become: true
  yum_repository: 
    name: grafana
    description: grafana
    baseurl: https://packages.grafana.com/oss/rpm
    repo_gpgcheck: 1
    enabled: 1
    gpgcheck: 1
    gpgkey: https://packages.grafana.com/gpg.key
    sslverify: 1
    sslcacert: /etc/pki/tls/certs/ca-bundle.crt

- name: install grafana
  vars: 
    package_name: 
      - grafana
    package_state: present
  include_role: 
    name: safe_yum

- name: Install Python dependencies
  pip:
    name:
      - Flask
      - oci
  become: yes

- name: Copy webhook script to server
  copy:
    src: files/ons_webhook.py
    dest: /opt/ons_webhook.py
    mode: '0755'

- name: Create systemd service for webhook
  copy:
    content: |
      [Unit]
      Description=OCI Webhook Service
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/ons_webhook.py
      Restart=always

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/ons-webhook.service
    mode: '0644'

- name: Start and enable webhook service
  systemd:
    name: ons-webhook
    state: started
    enabled: yes

- name: start grafana
  become: true
  service: 
    name: grafana-server
    state: restarted
    enabled: true

- name: Ensure grafana key directory exists
  file:
    path: "/etc/opt/oci-hpc/passwords/grafana"
    state: directory
  delegate_to: localhost

- name: Check api key list
  uri:
    url: "{{ grafana_api_url }}/api/auth/keys"
    user: "{{ grafana_security.admin_user }}"
    password: "{{ grafana_security.admin_password }}"
    force_basic_auth: true
    return_content: true
  no_log: false
  register: existing_api_keys

- name: Create prometheus datasource
  grafana_datasource:
    name: "Prometheus"
    grafana_url: "{{ grafana_api_url }}"
    grafana_user: "{{ grafana_security.admin_user }}"
    grafana_password: "{{ grafana_security.admin_password }}"
    ds_type: "prometheus"
    ds_url: "http://localhost:9090"
  ignore_errors: yes

